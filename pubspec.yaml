name: boo_mondai
description: "BooMondai — Gamified language learning with FSRS spaced repetition."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.8"

dependencies:
  flutter:
    sdk: flutter

  theme_variants:
    git:
      url: https://github.com/GuyWithBag/theme_variants.git

  media_variants:
    path: ../media_variants/

  # ── State & UI ──────────────────────────────────────────
  provider: ^6.1.2
  flutter_hooks: ^0.20.5

  # ── Code generation ─────────────────────────────────────
  barrel_annotation: 1.0.0

  # ── Local persistence ────────────────────────────────────
  hive_ce: 2.19.3
  hive_ce_flutter: 2.3.4

  # ── Input & pickers ─────────────────────────────────────
  flutter_picker_plus: 1.5.6
  flutter_colorpicker: 1.1.0

  # ── Notifications ────────────────────────────────────────
  flutter_local_notifications: ^21.0.0

  # ── Loading states ───────────────────────────────────────
  skeletonizer: 2.1.3

  # ── Utilities ────────────────────────────────────────────
  url_launcher: ^6.3.2
  flutter_screenutil: ^5.9.3

  # ── Backend ──────────────────────────────────────────────
  supabase_flutter: ^2.12.2

  # ── Navigation ───────────────────────────────────────────
  go_router: 17.0.1

  # ── Project-specific ─────────────────────────────────────
  fsrs: ^2.0.1 # FSRS spaced repetition algorithm
  uuid: ^4.5.1 # client-side UUID generation for offline-first
  dart_mappable: ^4.7.0
  app_links: ^7.0.0
  google_sign_in: ^7.2.0
  fuzzywuzzy: ^1.2.0
  vector_math: ^2.2.0
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1
  file_picker: ^11.0.2
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0
  flutter_animate: ^4.5.2
  unite_keyboard_visibility: ^0.4.1
  archive: ^4.0.9
  path_provider: ^2.1.6
  http: ^1.6.0
  just_audio: ^0.10.6
  signals: ^7.1.0
  flutter_soloud: ^4.0.12
  fl_chart: ^1.2.0
  signals_hooks: ^7.1.0
  cross_file: ^0.3.5+5
  csv: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.5.4
  barrel_generator: ^1.0.4
  hive_ce_generator: ^1.0.0
  flutter_launcher_icons: "^0.14.4"
  dart_mappable_builder: ^4.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/ui/button_up/
    - assets/ui/button_down/

analyzer:
  enable-experiment:
    - dot-shorthands

fonts:
  - family: Noto Sans
    fonts:
      - asset: fonts/noto_sans/NotoSans-VariableFont_wdth,wght.ttf
      - asset: fonts/noto_sans/NotoSans-Italic-VariableFont_wdth,wght.ttf
        style: italic
